name: Tests and desktop builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-build.txt
      - name: Install Linux graphical libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1
      - name: Install audited build backend
        run: python -m pip install -c requirements-build.txt setuptools
      - name: Install application and check tools
        run: python -m pip install --no-build-isolation -c requirements-build.txt -e ".[dev]"
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m pytest -q

  build:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-build.txt
      - name: Assert Linux build baseline
        if: runner.os == 'Linux'
        run: |
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 22.04
          python -c "import platform; assert platform.libc_ver() == ('glibc', '2.35'), platform.libc_ver()"
      - name: Install Linux graphical libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1
      - name: Install audited build backend
        run: python -m pip install -c requirements-build.txt setuptools
      - name: Install application and check tools
        run: python -m pip install --no-build-isolation -c requirements-build.txt -e ".[dev]"
      - run: python -m PyInstaller --clean --noconfirm InstaFollowAnalyzer.spec
      - name: Audit Linux symbol requirements
        if: runner.os == 'Linux'
        run: python scripts/audit_linux.py
      - name: Check packaged application startup (offscreen, not interactive)
        run: python scripts/check_bundle.py
      - name: Package sources, notices and native distribution
        run: python scripts/package.py
      - name: Check final archived distribution (offscreen, not interactive)
        run: python scripts/check_bundle.py --archive
      - name: Preserve Linux ABI evidence even on failure
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: Linux-ABI-audit
          path: build/linux-abi.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload candidates for manual validation
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: InstaFollowAnalyzer-${{ runner.os }}-x86_64-candidate
          path: |
            dist/InstaFollowAnalyzer-*.zip
            dist/InstaFollowAnalyzer-*.tar.gz
            dist/InstaFollowAnalyzer-*.sha256
          if-no-files-found: error
          retention-days: 14
